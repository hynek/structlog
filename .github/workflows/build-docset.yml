---
name: Build docset

on:
  push:
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1" # Crash loudly on uv.lock vs pyproject.toml inconsistencies

permissions: {}

jobs:
  docset:
    name: Build docset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # get correct version
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - uses: hynek/setup-cached-uv@v2.6.0

      - run: uv run --only-group tox tox run -e docset
      - run: tar --exclude='.DS_Store' -cvzf structlog.tgz structlog.docset

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: docset
          path: structlog.tgz
